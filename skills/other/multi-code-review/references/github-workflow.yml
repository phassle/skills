# Copy to .github/workflows/code-review.yml in the repo to review.
#
# Optional secrets, in that repo (or its organization):
#   LLM_API_KEY       optional: LLM reviewers (code goes to the LLM API)
#   TYPESAFE_API_KEY  optional: Jev as judge
name: code-review

on:
  pull_request:

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: phassle/multi-code-review/.github/workflows/review.yml@main
    with:
      # Install dependencies so ESLint, tsc, Roslyn … can run; the analyzers have no network.
      prepare: npm ci
      # levels: security=maximum,testing=minimum   # when the repo has no .mcr/settings.yml
      # offline: true                              # no LLM, no Jev: no code leaves the runner
    secrets:
      llm_api_key: ${{ secrets.LLM_API_KEY }}
      typesafe_api_key: ${{ secrets.TYPESAFE_API_KEY }}
