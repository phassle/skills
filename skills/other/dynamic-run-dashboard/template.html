<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Implement — run dashboard</title>
<style>
  /* Monterro design system — colors_and_type.css tokens, inlined so this file stands alone */
  @font-face { font-family: 'Arial'; font-style: normal; font-weight: 300 400; src: local('Arial'), local('ArialMT'), local('Helvetica Neue'), local('Helvetica'); }
  @font-face { font-family: 'Arial'; font-style: normal; font-weight: 500 700; src: local('Arial Bold'), local('Arial-BoldMT'), local('Helvetica Neue Bold'), local('Helvetica Bold'); }

  :root {
    --navy: #010031;
    --orange: #FC6C54;
    --orange-dark: #fe5a3e;
    --yellow: #FFEC9B;
    --sand: #FFDFD1;
    --aqua: #6470F6;
    --status-green: #64ce91;
    --status-orange: #fdd761;
    --status-red: #fd6461;

    --bg: #FAFAF4;
    --surface: #ffffff;
    --surface-2: #f4f3ec;
    --ink: #0C0D0E;
    --ink-head: #010031;
    --ink-2: #4a4b5c;
    --ink-3: #80819a;
    --line: #e6e3da;
    --accent: #FC6C54;
    --sel-bg: #fff7f0;
    --code-bg: #010031;
    --code-ink: #FAFAF4;
    --code-line: #2a2856;
    --shadow-sm: 0 1px 2px rgba(1, 0, 49, 0.06);
    --shadow-md: 0 6px 18px rgba(1, 0, 49, 0.08);
    --grad-warm: linear-gradient(90deg, #ff6c52 0%, #ffb893 55%, #ffec9b 100%);

    --r-sm: 8px;
    --r-md: 14px;
    --r-pill: 999px;
    --dur: 320ms;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #010031;
      --surface: #0a0945;
      --surface-2: #131144;
      --ink: #FAFAF4;
      --ink-head: #FAFAF4;
      --ink-2: #c1c0cc;
      --ink-3: #80819a;
      --line: #2a2856;
      --sel-bg: #1b1950;
      --code-bg: #0C0D0E;
      --code-ink: #FAFAF4;
      --code-line: #2e2f31;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #010031; --surface: #0a0945; --surface-2: #131144;
    --ink: #FAFAF4; --ink-head: #FAFAF4; --ink-2: #c1c0cc; --ink-3: #80819a;
    --line: #2a2856; --sel-bg: #1b1950;
    --code-bg: #0C0D0E; --code-ink: #FAFAF4; --code-line: #2e2f31;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #FAFAF4; --surface: #ffffff; --surface-2: #f4f3ec;
    --ink: #0C0D0E; --ink-head: #010031; --ink-2: #4a4b5c; --ink-3: #80819a;
    --line: #e6e3da; --sel-bg: #fff7f0;
    --code-bg: #010031; --code-ink: #FAFAF4; --code-line: #2a2856;
    --shadow-sm: 0 1px 2px rgba(1, 0, 49, 0.06); --shadow-md: 0 6px 18px rgba(1, 0, 49, 0.08);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    margin: 0;
    padding: 0 24px 96px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding-top: 44px; }
  .logo { height: 26px; width: auto; flex: none; margin-top: 6px; }
  .logo-white { display: none; }
  @media (prefers-color-scheme: dark) { .logo-navy { display: none; } .logo-white { display: block; } }
  :root[data-theme="dark"] .logo-navy { display: none; }
  :root[data-theme="dark"] .logo-white { display: block; }
  :root[data-theme="light"] .logo-navy { display: block; }
  :root[data-theme="light"] .logo-white { display: none; }

  h1 {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--ink-head);
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .accent-line { border: 0; border-top: 2px solid var(--orange); margin: 0 0 20px; width: 100%; animation: rule-grow 900ms var(--ease) both; }
  @keyframes rule-grow { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); transform-origin: left; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 540ms var(--ease) both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .purpose { font-size: 18px; color: var(--ink-head); margin: 0 0 8px; max-width: 72ch; text-wrap: pretty; }
  .sub { color: var(--ink-2); margin: 0 0 8px; max-width: 76ch; font-size: 14px; }

  h2 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink-head);
    margin: 44px 0 8px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--orange);
    text-wrap: balance;
  }
  code, .mono { font-family: var(--mono); font-size: .9em; }
  .num { font-variant-numeric: tabular-nums; }
  .gap { color: var(--ink-3); }
  /* A gap that carries a reason is marked, so it is discoverable without hovering every dash. */
  .gap.why { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }

  /* masthead — where the run is */
  .masthead { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 20px; box-shadow: var(--shadow-sm); }
  .masthead .label { font-size: 12px; color: var(--ink-3); }
  .masthead .val { font-size: 14px; font-weight: 600; color: var(--ink-head); word-break: break-word; }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .tile .label { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .tile .value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-head); }
  .tile .hint { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .tile.spend .value { color: var(--orange); }

  /* progress bar */
  .barbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 20px; margin-top: 12px; box-shadow: var(--shadow-sm); }
  .bar { height: 12px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--grad-warm); transition: width var(--dur) var(--ease); }
  .barmeta { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }

  /* filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0 12px; }
  .chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: var(--r-pill); padding: 6px 16px; font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; transition: background 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease); }
  .chip:hover { border-color: var(--ink-head); color: var(--ink-head); }
  .chip[aria-pressed="true"] { background: var(--ink-head); color: var(--bg); border-color: var(--ink-head); }
  .chip:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
  #search { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 7px 14px; font-family: var(--font); font-size: 13.5px; min-width: 190px; }

  /* unit board — state on the left rule, model family in the chips */
  .wave { margin-top: 20px; }
  .wavehead { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
  .wavenum { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--bg); background: var(--ink-head); border-radius: var(--r-pill); padding: 2px 10px; flex: none; }
  .wavetitle { font-size: 14px; font-weight: 600; color: var(--ink-head); }
  .wavenote { font-size: 12.5px; color: var(--ink-3); }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .unit { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .unit.ok { border-left-color: var(--status-green); }
  .unit.live { border-left-color: var(--aqua); }
  .unit.waiting { border-left-color: var(--status-orange); }
  .unit.blocked { border-left-color: var(--status-red); }
  .unithead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .unitid { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .unittitle { font-size: 14px; font-weight: 600; color: var(--ink-head); margin: 2px 0 8px; }
  .unitmeta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
  .unitmeta dt { color: var(--ink-3); }
  .unitmeta dd { margin: 0; }
  .unitnote { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }

  /* state pill — semantic axis, kept off the model axis */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ink-3); }
  .pill.ok::before { background: var(--status-green); }
  .pill.live::before { background: var(--aqua); }
  .pill.waiting::before { background: var(--status-orange); }
  .pill.blocked::before { background: var(--status-red); }

  /* model chips — implementer side one hue, reviewer side another */
  .mchip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11.5px; font-weight: 600; border-radius: var(--r-pill); padding: 1px 9px; white-space: nowrap; border: 1px solid transparent; }
  .mchip.impl { background: var(--sand); color: #010031; }
  .mchip.rev { background: #e2e4ff; color: #010031; }
  .mchip.plain { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
  .mchip .eff { font-weight: 400; opacity: .75; }
  .mchip + .mchip { margin-left: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-3); margin: 10px 0 0; align-items: center; }

  /* tables */
  .tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow-x: auto; box-shadow: var(--shadow-sm); margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th.r, td.r { text-align: right; }
  td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td .name { font-weight: 600; color: var(--ink-head); }
  td .desc { font-size: 12.5px; color: var(--ink-2); max-width: 52ch; }

  /* lessons */
  .lessons { display: grid; gap: 12px; margin-top: 12px; }
  .lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; box-shadow: var(--shadow-sm); }
  .lesson .t { font-weight: 600; font-size: 14px; color: var(--ink-head); }
  /* Navy on yellow in every theme: the chip keeps its own background, so it must not
     inherit a theme-dependent ink or it goes off-white on yellow under a forced theme. */
  .lesson .kind { font-size: 11px; font-weight: 600; border-radius: var(--r-pill); padding: 1px 9px; margin-left: 8px; vertical-align: 1px; color: #010031; background: var(--yellow); }
  .lesson dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
  .lesson dt { color: var(--ink-3); white-space: nowrap; }
  .lesson dd { margin: 0; }

  /* collapsibles + notes */
  details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); margin: 12px 0 10px; box-shadow: var(--shadow-sm); }
  summary { padding: 14px 18px; font-weight: 600; font-size: 14px; color: var(--ink-head); cursor: pointer; }
  details .inner { padding: 0 18px 16px; overflow-x: auto; }
  details table { min-width: 0; font-size: 13.5px; }
  .note { font-size: 13px; color: var(--ink-2); max-width: 76ch; }
  .note code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  footer { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
  footer p { margin: 0 0 4px; max-width: 76ch; }
</style>
</head>

  </header>
  <hr class="accent-line">
  <p class="purpose rise" id="purpose"></p>
  <p class="sub rise" id="sub"></p>

  <h2>Where is the run?</h2>
  <div class="masthead rise" id="masthead"></div>
  <div class="tiles rise" id="tiles"></div>
  <div class="barbox">
    <div class="bar"><div class="fill" id="barFill" style="width:0%"></div></div>
    <div class="barmeta"><span id="barLeft"></span><span id="barRight"></span></div>
  </div>

  <h2>What is being built?</h2>
  <p class="note" id="boardNote"></p>
  <div class="filters" role="group" aria-label="Filter units">
    <button class="chip" aria-pressed="true" data-f="all">All</button>
    <button class="chip" aria-pressed="false" data-f="ok">Integrated</button>
    <button class="chip" aria-pressed="false" data-f="live">In flight</button>
    <button class="chip" aria-pressed="false" data-f="waiting">Queued</button>
    <button class="chip" aria-pressed="false" data-f="blocked">Blocked</button>
    <input id="search" type="search" placeholder="Search units" aria-label="Search units">
  </div>
  <div id="board"></div>
  <div class="legend" id="legend"></div>

  <h2>How is work routed and reviewed?</h2>
  <p class="note" id="routingNote"></p>
  <div class="tablebox">
    <table>
      <thead><tr><th>Role</th><th>Route</th><th>Escalation</th><th>Why this route</th></tr></thead>
      <tbody id="roles"></tbody>
    </table>
  </div>
  <div id="pipeline"></div>
  <div id="usage"></div>

  <h2>What did the run learn?</h2>
  <p class="note" id="lessonsNote"></p>
  <div class="lessons" id="lessons"></div>

  <footer id="footer"></footer>
</div>

<script>
// __DATA__ is replaced by the dynamic-run-dashboard skill with real run state.
const DATA = /*__DATA__*/ null;

// Nullish escapes to nothing, never to the strings "null" or "undefined": every field in the
// contract is optional, so an omitted label or id has to stay missing rather than render itself.
const esc = s => s == null ? "" : String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// A missing figure stays visibly missing — never estimated. An em dash alone says nothing to
// a screen reader, so the reason travels in aria-label; title only adds it for mouse hover.
const gap = why => why
  ? `<span class="gap why" title="${esc(why)}" aria-label="Not available: ${esc(why)}">—</span>`
  : `<span class="gap" aria-label="not available">—</span>`;
const cell = v => v === null || v === undefined || v === ""
  ? gap(null)
  : (typeof v === "object" ? gap(v.why || "no reason recorded") : esc(v));
const STATES = { ok: "Integrated", live: "In flight", waiting: "Queued", blocked: "Blocked" };

if (DATA.title) document.getElementById("title").textContent = DATA.title;
document.getElementById("purpose").innerHTML = DATA.purpose || "";
document.getElementById("sub").innerHTML = DATA.subtitle || "";
document.getElementById("boardNote").innerHTML = DATA.boardNote || "";
document.getElementById("routingNote").innerHTML = (DATA.routing && DATA.routing.note) || "";
document.getElementById("lessonsNote").innerHTML = (DATA.lessons && DATA.lessons.note) || "";

const mastEl = document.getElementById("masthead");
for (const m of DATA.masthead || []) {
  mastEl.insertAdjacentHTML("beforeend",
    `<div><div class="label">${esc(m.label)}</div><div class="val ${m.mono ? "mono" : ""}">${cell(m.value)}</div></div>`);
}

const tilesEl = document.getElementById("tiles");
for (const t of DATA.tiles || []) {
  tilesEl.insertAdjacentHTML("beforeend",
    `<div class="tile ${t.kind === "spend" ? "spend" : ""}"><div class="label">${esc(t.label)}</div>` +
    `<div class="value num">${cell(t.value)}</div><div class="hint">${esc(t.hint || "")}</div></div>`);
}

const prog = DATA.progress || {};
const pct = prog.total ? Math.round((prog.done || 0) / prog.total * 100) : 0;
// Clamp once: a bar pinned at 100% beside a label reading 111% makes the reader distrust both.
const shown = Math.max(0, Math.min(100, pct));
document.getElementById("barFill").style.width = shown + "%";
document.getElementById("barLeft").textContent = prog.total
  ? `${prog.done || 0} of ${prog.total} units integrated (${shown}%)`
  : "";
document.getElementById("barRight").textContent = prog.label || "";

function mchips(list, cls) {
  if (!list || !list.length) return gap(null);
  return list.map(a =>
    // The flex gap separates these visually; the space keeps them separate when copied or read aloud.
    `<span class="mchip ${cls}">${esc(a.model)}${a.effort ? ` <span class="eff">${esc(a.effort)}</span>` : ""}` +
    `${a.role ? ` · ${esc(a.role)}` : ""}</span>`).join("");
}

let filter = "all", query = "";
const boardEl = document.getElementById("board");

function renderBoard() {
  boardEl.innerHTML = "";
  for (const w of DATA.waves || []) {
    const units = (w.units || []).filter(u =>
      (filter === "all" || u.state === filter) &&
      // Drop absent fields rather than searching the text "undefined" for them.
      (query === "" || [u.id, u.title, u.note].filter(Boolean).join(" ").toLowerCase().includes(query)));
    if (!units.length) continue;
    const cards = units.map(u => `
      <article class="unit ${esc(u.state || "")}">
        <div class="unithead">
          <span class="unitid">${esc(u.id)}</span>
          <span class="pill ${esc(u.state || "")}">${esc(STATES[u.state] || u.state || "")}</span>
        </div>
        <div class="unittitle">${esc(u.title)}</div>
        <dl class="unitmeta">
          <dt>Built by</dt><dd>${mchips(u.impl, "impl")}</dd>
          <dt>Reviewed by</dt><dd>${mchips(u.review, "rev")}</dd>
          <dt>Commit</dt><dd class="mono">${cell(u.commit)}</dd>
          <dt>Diffstat</dt><dd class="mono num">${cell(u.diffstat)}</dd>
          <dt>Review passes</dt><dd class="num">${cell(u.passes)}</dd>
          <dt>Findings</dt><dd>${cell(u.findings)}</dd>
        </dl>
        ${u.note ? `<div class="unitnote">${u.note}</div>` : ""}
      </article>`).join("");
    boardEl.insertAdjacentHTML("beforeend", `
      <section class="wave">
        <div class="wavehead">
          <span class="wavenum">Wave ${esc(w.wave)}</span>
          <span class="wavetitle">${esc(w.title || "")}</span>
          <span class="wavenote">${esc(w.note || "")}</span>
        </div>
        <div class="board">${cards}</div>
      </section>`);
  }
  if (!boardEl.innerHTML) boardEl.innerHTML = `<p class="note">No units match this filter.</p>`;
}

document.getElementById("legend").innerHTML =
  `<span class="mchip impl">implementer</span><span class="mchip rev">reviewer</span>` +
  Object.entries(STATES).map(([k, v]) => `<span class="pill ${k}">${v}</span>`).join("");

const rolesEl = document.getElementById("roles");
for (const r of (DATA.routing && DATA.routing.roles) || []) {
  rolesEl.insertAdjacentHTML("beforeend",
    `<tr><td><div class="name">${esc(r.role)}</div></td>` +
    `<td>${mchips(r.route, r.side === "review" ? "rev" : r.side === "implement" ? "impl" : "plain")}</td>` +
    `<td class="mono" style="font-size:12px;color:var(--ink-3)">${cell(r.escalation)}</td>` +
    `<td><div class="desc">${r.why ? r.why : gap(null)}</div></td></tr>`);
}

const pipe = DATA.pipeline;
if (pipe && pipe.steps && pipe.steps.length) {
  const rows = pipe.steps.map(s =>
    `<tr><td><div class="name">${esc(s.stage)}</div></td><td>${mchips(s.who, s.side === "review" ? "rev" : "impl")}</td>` +
    `<td><div class="desc">${s.sees ? s.sees : gap(null)}</div></td></tr>`).join("");
  document.getElementById("pipeline").insertAdjacentHTML("beforeend",
    `<details open><summary>${esc(pipe.title || "Per-unit pipeline")}</summary><div class="inner">` +
    `${pipe.note ? `<p class="note" style="margin-top:0">${pipe.note}</p>` : ""}` +
    `<table><thead><tr><th>Stage</th><th>Who</th><th>What it may see</th></tr></thead><tbody>${rows}</tbody></table>` +
    `</div></details>`);
}

// Model usage — one row per model+effort actually dispatched, from out/*.json.
const usage = DATA.usage;
if (usage && usage.rows && usage.rows.length) {
  const rows = usage.rows.map(r =>
    `<tr><td>${mchips([{ model: r.model, effort: r.effort }], r.side === "review" ? "rev" : r.side === "implement" ? "impl" : "plain")}</td>` +
    `<td class="desc">${r.roles ? esc(r.roles) : gap(null)}</td>` +
    `<td class="r num">${cell(r.agents)}</td><td class="r num">${cell(r.turns)}</td>` +
    `<td class="r num">${cell(r.duration)}</td><td class="r num">${cell(r.cost)}</td></tr>`).join("");
  const tot = usage.total;
  const foot = tot
    ? `<tr><td><strong>Total</strong></td><td class="desc">${esc(tot.note || "")}</td>` +
      `<td class="r num"><strong>${cell(tot.agents)}</strong></td><td class="r num"><strong>${cell(tot.turns)}</strong></td>` +
      `<td class="r num"><strong>${cell(tot.duration)}</strong></td><td class="r num"><strong>${cell(tot.cost)}</strong></td></tr>`
    : "";
  document.getElementById("usage").insertAdjacentHTML("beforeend",
    `<details><summary>${esc(usage.title || "Model usage — who ran, how often, at what cost")}</summary><div class="inner">` +
    `${usage.note ? `<p class="note" style="margin-top:0">${usage.note}</p>` : ""}` +
    `<table><thead><tr><th>Model · effort</th><th>Roles</th><th class="r">Agents</th><th class="r">Turns</th>` +
    `<th class="r">Duration</th><th class="r">Measured cost</th></tr></thead><tbody>${rows}${foot}</tbody></table>` +
    `</div></details>`);
}

const lessonsEl = document.getElementById("lessons");
for (const l of (DATA.lessons && DATA.lessons.items) || []) {
  lessonsEl.insertAdjacentHTML("beforeend",
    `<article class="lesson"><span class="t">${esc(l.title)}</span>` +
    `${l.kind ? `<span class="kind">${esc(l.kind)}</span>` : ""}` +
    `<dl><dt>Failure</dt><dd>${l.failure || gap(null)}</dd>` +
    `<dt>Change</dt><dd>${l.change || gap(null)}</dd>` +
    `${l.landed ? `<dt>Landed in</dt><dd class="mono">${esc(l.landed)}</dd>` : ""}</dl></article>`);
}
if (!lessonsEl.innerHTML) lessonsEl.innerHTML = `<p class="note">Nothing recorded yet — the run has produced no routing change or safeguard so far.</p>`;

document.getElementById("footer").innerHTML =
  (DATA.footer || []).map(p => `<p>${p}</p>`).join("");

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  b.setAttribute("aria-pressed", "true");
  filter = b.dataset.f;
  renderBoard();
}));
document.getElementById("search").addEventListener("input", e => { query = e.target.value.toLowerCase(); renderBoard(); });

renderBoard();
</script>
</body>
</html>
